[package]
name = "proa_example"
version = "0.1.0"
edition = "2021"
# Proa's minimum supported Rust version.
rust-version = "1.93"
publish = false

[dependencies]
ndarray = "0.17"
plotly = { path = "../../plotly" }
proa_core = { git = "https://github.com/proa-labs/proa", rev = "43c28ff2c94b3f148094300df761eac086e618a7" }
proa_framework_core = { git = "https://github.com/proa-labs/proa", rev = "43c28ff2c94b3f148094300df761eac086e618a7", default-features = false }
proa_macros = { git = "https://github.com/proa-labs/proa", rev = "43c28ff2c94b3f148094300df761eac086e618a7" }
serde_json = "1"

[dev-dependencies]
html-escape = "0.2"
