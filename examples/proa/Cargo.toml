[package]
name = "proa_example"
version = "0.1.0"
edition = "2021"
# Proa's minimum supported Rust version.
rust-version = "1.93"
publish = false

[dependencies]
ndarray = "0.17"
plotly = { path = "../../plotly" }
proa_core = { git = "https://github.com/proa-labs/proa", rev = "5609d251f591912380948ed915106c9b9bf2fc17" }
proa_framework_core = { git = "https://github.com/proa-labs/proa", rev = "5609d251f591912380948ed915106c9b9bf2fc17", default-features = false }
proa_macros = { git = "https://github.com/proa-labs/proa", rev = "5609d251f591912380948ed915106c9b9bf2fc17" }
serde_json = "1"

[dev-dependencies]
html-escape = "0.2"
