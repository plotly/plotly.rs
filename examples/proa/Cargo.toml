[package]
name = "proa_example"
version = "0.1.0"
edition = "2021"
# Proa's minimum supported Rust version.
rust-version = "1.93"
publish = false

[dependencies]
ndarray = "0.17"
plotly = { path = "../../plotly" }
proa_core = { git = "https://github.com/proa-labs/proa", rev = "4911acbc310d1679826e449014740e475d411f7a" }
proa_framework_core = { git = "https://github.com/proa-labs/proa", rev = "4911acbc310d1679826e449014740e475d411f7a", default-features = false }
proa_macros = { git = "https://github.com/proa-labs/proa", rev = "4911acbc310d1679826e449014740e475d411f7a" }
serde_json = "1"

[dev-dependencies]
html-escape = "0.2"
