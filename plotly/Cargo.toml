[package]
name = "plotly"
version = "0.15.0"
description = "A plotting library powered by Plotly.js"
authors = [
    "Ioannis Giagkiozis <i.giagkiozis@gmail.com>",
    "Andrei Gherghescu <andrei-ng@protonmail.com>",
]
license = "MIT"
readme = "../README.md"
documentation = "https://docs.rs/plotly"
repository = "https://github.com/plotly/plotly.rs"
edition = "2021"
keywords = ["plot", "chart", "plotly"]

exclude = ["target/*"]

[features]
static_export_chromedriver = [
    "plotly_static",
    "plotly_static/chromedriver",
    "async-trait",
]
static_export_geckodriver = [
    "plotly_static",
    "plotly_static/geckodriver",
    "async-trait",
]
static_export_wd_download = ["plotly_static/webdriver_download"]
static_export_default = [
    "plotly_static",
    "plotly_static/chromedriver",
    "plotly_static/webdriver_download",
    "async-trait",
]

plotly_ndarray = ["ndarray"]
plotly_image = ["image"]
plotly_embed_js = []

# All non-conflicting features
all = [
    "plotly_ndarray",
    "plotly_image",
    "plotly_embed_js",
    "static_export_default",
]
# This is used for enabling extra debugging messages and debugging functionality
debug = ["plotly_static?/debug"]

[dependencies]
askama = { version = "0.16.0", features = ["serde_json"] }
dyn-clone = "1"
erased-serde = "0.4"
image = { version = "0.25", optional = true }
plotly_derive = { version = "0.15", path = "../plotly_derive" }
plotly_static = { version = "0.2", path = "../plotly_static", optional = true }
ndarray = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
serde_with = ">=2, <4"
rand = { version = "0.10", default-features = false, features = ["alloc"] }
async-trait = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4" }
wasm-bindgen = { version = "0.2" }
serde-wasm-bindgen = { version = "0.6.3" }
web-sys = { version = "0.3.77", features = [
    "Document",
    "Window",
    "HtmlElement",
] }

[dev-dependencies]
csv = "1.1"
image = "0.25"
itertools = ">=0.10, <0.16"
itertools-num = "0.1"
ndarray = "0.17"
rand_distr = "0.6"
base64 = "0.23"
